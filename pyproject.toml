[project]
name = "risk_grid"
version = "0.1.0"
description = "Browser-based post-trade stress and position analytics for broker-dealers"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "polars>=1.0",
    "pyarrow>=17.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
